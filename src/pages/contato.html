    <h1 class="titulo4">Contato</h1>
    <form class="titulo4">
        <fieldset>
            <legend>Formulário de Contato</legend>
            <br>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome..." required>

            <br><br>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail..." required>

            <br><br>
            <label for="numeroTelefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(Seu DDD) 99999-0000">
            
            <br><br>
            <label for="assunto">Assunto:</label>
                <select id="assunto" name="assunto">
                    <option value="">Selecione um assunto</option>
                    <option value="duvida">Dúvida</option>
                    <option value="elogio">Elogio</option>
                    <option value="reclamacao">Reclamação</option>
                </select>

            <br><br>
            <label for="contato">Prefiro ser contatado por:</label>
            <input type="radio" id="email-contato" name="contato" value="email">
            <label for="email-contato">E-mail</label>
            <input type="radio" id="telefone-contato" name="contato" value="telefone">
            <label for="telefone-contato">Telefone</label>

            <br><br>
            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" placeholder="Digite aqui sua mensagem..." required></textarea>

            <br><br>
            <label>
            <input type="checkbox" name="privacidade" required>
                Aceito a política de privacidade
            </label>
            <br><br>
            <button type="submit">
                Enviar formulário
            </button>
            <button type="reset">
                Limpar formulário
            </button>
        </fieldset>
    </form>
</body>
